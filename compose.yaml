name: autolog
services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: autolog
      POSTGRES_USER: autolog
      POSTGRES_PASSWORD: autolog
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - autolog-postgres:/var/lib/postgresql
      - ./dev/init-test-db.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autolog -d autolog"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  autolog-postgres:
