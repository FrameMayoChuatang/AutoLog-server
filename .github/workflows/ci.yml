name: 서버 검증
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autolog_test
          POSTGRES_USER: autolog
          POSTGRES_PASSWORD: autolog
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U autolog -d autolog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/autolog_test
      DB_USERNAME: autolog
      DB_PASSWORD: autolog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 포맷·통합 테스트·실행 파일 검증
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/*.xml
          retention-days: 7
