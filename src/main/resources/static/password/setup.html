<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AutoLog 비밀번호 설정</title><link rel="stylesheet" href="/password/setup.css"><script src="/password/setup.js" defer></script></head><body><main><h1>AutoLog 비밀번호 설정</h1><p>대표 관리자에게 받은 초대 링크로 비밀번호를 설정합니다.</p><form id="setup"><label>새 비밀번호<input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required></label><label>비밀번호 확인<input id="confirm" type="password" autocomplete="new-password" required></label><button>비밀번호 설정</button></form><p id="result" role="status" aria-live="polite"></p></main></body></html>
